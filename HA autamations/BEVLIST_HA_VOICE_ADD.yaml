alias: Bevásárlólista hangvezérlés - hozzáadás
description: ''
triggers:
  - trigger: conversation
    command:
      - írd fel {valami}
      - add hozzá {valami}
      - tedd fel {valami}
      - vegyünk {valami}
conditions: []
actions:
  - set_conversation_response: ''
  - variables:
      media_players: |
        {{ device_entities(trigger.device_id)
          | select('match', '^media_player\.')
          | list }}
      source_media_player: |
        {% set normal_players = media_players
          | reject('search', 'sendspin')
          | list %}

        {{ normal_players | first
          if normal_players | count > 0
          else media_players | first }}
      parancs: '{{ trigger.slots.valami }}'
  - action: conversation.process
    data:
      agent_id: conversation.google_ai_conversation
      language: HU
      text: >-
        Feladatod egy magyar nyelvű bevásárlólista-tétel feldolgozása.

        A bemeneti szöveg: "{{ parancs }}"

        Bontsd fel az alábbi mezőkre:

        mit: a megvásárolandó termék neve, alapalakban. Kötelező. mennyit: szám,
        ha a felhasználó megadta, egyébként null. me: mértékegység, ha megadta,
        egyébként null. honnan: bolt vagy beszerzési hely neve, ha megadta,
        egyébként null.

        Szabályok: - Semmilyen hiányzó adatot ne találj ki. - A magyar ragokat
        távolítsd el, ahol szükséges. - A termék nevét alapalakban add vissza. -
        A bolt nevét normalizáld. - Ha mennyiség nincs megadva, mennyit = null.
        - Ha mértékegység nincs megadva, me = null. - Ha bolt nincs megadva,
        honnan = null. - Csak érvényes JSON objektumot adj vissza. - Ne írj
        magyarázatot. - Ne használj markdown kódblokkot.

        Mértékegység-normalizálás: - deka, dekagramm -> dkg - kiló, kilogramm ->
        kg - gramm -> g - liter -> l - deci, deciliter -> dl - milliliter -> ml
        - darab -> db - csomag -> csomag

        A válasz pontos szerkezete:
        {"mit":"tej","mennyit":2,"me":"l","honnan":"Lidl"}
    response_variable: ai_valasz
  - variables:
      parsed: '{{ ai_valasz.response.speech.plain.speech | from_json }}    '
      hang_valasz: >-
        {% if parsed.mennyit is not none and parsed.me is not none and
        parsed.honnan is not none %}
          Felírtam: {{ parsed.mennyit }} {{ parsed.me }} {{ parsed.mit }}, {{ parsed.honnan }}.
        {% elif parsed.mennyit is not none and parsed.me is not none %}
          Felírtam: {{ parsed.mennyit }} {{ parsed.me }} {{ parsed.mit }}.
        {% elif parsed.honnan is not none %}
          Felírtam: {{ parsed.mit }}, {{ parsed.honnan }}.
        {% else %}
          Felírtam: {{ parsed.mit }}.
        {% endif %}
  - action: rest_command.bevlist_add
    data:
      mit: '{{ parsed.mit }}'
      mennyit: '{{ parsed.mennyit }}'
      me: '{{ parsed.me }}'
      honnan: '{{ parsed.honnan }}'
    response_variable: rest_valasz
  - action: tts.cloud_say
    data:
      entity_id: '{{ source_media_player }}'
      message: '{{ hang_valasz }}'
      options:
        voice: TamasNeural
      cache: false
mode: single
