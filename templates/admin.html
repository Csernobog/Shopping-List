<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bevásárlólista Admin</title>

    <link
        rel="stylesheet"
        href="static/style.css"
    >
</head>

<body>

<div class="container">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <h1><img src="static/trolley.jpg" alt="" style="width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:10px;">Bevásárlólista</h1>
        <a href="/bevlist/lista" style="display:inline-block;padding:9px 14px;border-radius:8px;background:#f0f0f0;color:#222;text-decoration:none;font-weight:600;">← Vissza a listához</a>
    </div>

    <section class="add-box">

        <h2>Új tétel</h2>

        <div class="form-grid">

            <input
                id="mit"
                type="text"
                placeholder="Mit?"
            >

            <input
                id="mennyit"
                type="number"
                step="any"
                placeholder="Mennyit?"
            >

            <input
                id="me"
                type="text"
                placeholder="Mértékegység"
            >

            <input
                id="honnan"
                type="text"
                placeholder="Honnan?"
            >

        </div>

        <button onclick="addItem()">
            Hozzáadás
        </button>

    </section>


    <section>

        <div class="list-header">

            <h2>Lista</h2>

            <button
                class="danger"
                onclick="deleteAll()"
            >
                Minden törlése
            </button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>✓</th>
                    <th>Mit</th>
                    <th>Mennyit</th>
                    <th>ME</th>
                    <th>Honnan</th>
                    <th>Törlés</th>
                </tr>
            </thead>

            <tbody id="lista"></tbody>

        </table>

    </section>

</div>

<script src="static/admin.js"></script>

</body>

</html>
